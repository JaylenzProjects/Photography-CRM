{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto bg-white p-8 rounded-xl border border-gray-200 shadow-sm">
    <h1 class="text-2xl font-semibold mb-6">Log in</h1>
    <form method="post" class="space-y-4">
        {% csrf_token %}
        {% include "accounts/_form_fields.html" %}
        <input type="hidden" name="next" value="{{ next }}">
        <button type="submit" class="w-full bg-gray-900 text-white rounded-lg py-2 hover:bg-gray-700">Log in</button>
    </form>
    <p class="text-sm mt-4 text-gray-600">No account? <a href="{% url 'signup' %}" class="underline">Sign up</a></p>
</div>
{% endblock %}
