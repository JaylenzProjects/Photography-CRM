{% extends "base.html" %}
{% block title %}Sign up{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto bg-white p-8 rounded-xl border border-gray-200 shadow-sm">
    <h1 class="text-2xl font-semibold mb-6">Create your account</h1>
    <form method="post" class="space-y-4">
        {% csrf_token %}
        {% include "accounts/_form_fields.html" %}
        <button type="submit" class="w-full bg-gray-900 text-white rounded-lg py-2 hover:bg-gray-700">Sign up</button>
    </form>
    <p class="text-sm mt-4 text-gray-600">Have an account? <a href="{% url 'login' %}" class="underline">Log in</a></p>
</div>
{% endblock %}
