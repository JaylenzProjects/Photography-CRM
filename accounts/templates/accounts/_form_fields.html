{% if form.non_field_errors %}
<div class="mb-4 rounded-lg bg-red-50 p-3 text-sm text-red-700">{{ form.non_field_errors }}</div>
{% endif %}
{% for field in form %}
<div>
    <label for="{{ field.id_for_label }}" class="block text-sm font-medium mb-1">{{ field.label }}</label>
    {{ field }}
    {% if field.help_text %}
    <div class="mt-1 text-xs text-gray-500">{{ field.help_text|safe }}</div>
    {% endif %}
    {% for error in field.errors %}
    <p class="mt-1 text-sm text-red-600">{{ error }}</p>
    {% endfor %}
</div>
{% endfor %}
